<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusTrack - Premium Productivity Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 50px -12px rgba(99, 102, 241, 0.25);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between relative overflow-x-hidden">

    <!-- Background Decorative Glow Orbs -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-indigo-600/30 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-purple-600/20 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- Navigation Header -->
    <header class="w-full border-b border-slate-800/80 bg-slate-950/40 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">🎯</div>
                <span class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">FocusTrack</span>
            </div>
            <span class="text-xs font-semibold px-3 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300">
                Pro Suite v2.0
            </span>
        </div>
    </header>

    <!-- Main Auth Section -->
    <main class="flex-1 flex items-center justify-center p-4 my-8 relative z-10">
        <div class="w-full max-w-md glass-card rounded-3xl p-8 glow-effect">
            
            <!-- Header Text -->
            <div class="text-center mb-8">
                <h2 id="formTitle" class="text-2xl font-bold tracking-tight text-white">Welcome Back</h2>
                <p id="formSub" class="text-xs text-slate-400 mt-1">Enter your details to access your workspace</p>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 p-1 bg-slate-900/80 border border-slate-800 rounded-2xl mb-6">
                <button id="loginTabBtn" onclick="showForm('login')" class="py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-white bg-indigo-600 shadow-md">
                    Login
                </button>
                <button id="registerTabBtn" onclick="showForm('register')" class="py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-slate-400 hover:text-white">
                    Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username / Email</label>
                    <input type="text" id="loginUser" placeholder="admin@focustrack.com" required 
                        class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="loginPass" placeholder="••••••••" required 
                        class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                </div>
                <button type="submit" 
                    class="w-full mt-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg shadow-indigo-500/25 transition active:scale-[0.98]">
                    Launch Workspace →
                </button>
            </form>

            <!-- REGISTER FORM -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required 
                        class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Gender</label>
                        <select id="regSex" required class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3 py-3 text-sm text-slate-300 outline-none transition">
                            <option value="Male" class="bg-slate-900">Male</option>
                            <option value="Female" class="bg-slate-900">Female</option>
                            <option value="Other" class="bg-slate-900">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Mobile Number</label>
                        <input type="tel" id="regPhone" placeholder="10 digits" required 
                            class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="regEmail" placeholder="john@example.com" required 
                        class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                        <input type="text" id="regUsername" placeholder="username" required 
                            class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                        <input type="password" id="regPassword" placeholder="••••••••" required 
                            class="w-full bg-slate-900/60 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition">
                    </div>
                </div>

                <button type="submit" 
                    class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
                    Create Account →
                </button>
            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900/60">
        &copy; 2026 FocusTrack Systems Inc. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('currentUser')) {
                window.location.href = 'dashboard.html';
            }
        });

        function showForm(type) {
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const regBtn = document.getElementById('registerTabBtn');
            const title = document.getElementById('formTitle');
            const sub = document.getElementById('formSub');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                loginBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-white bg-indigo-600 shadow-md";
                regBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-slate-400 hover:text-white";
                title.innerText = "Welcome Back";
                sub.innerText = "Enter your details to access your workspace";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                regBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-white bg-indigo-600 shadow-md";
                loginBtn.className = "py-2.5 text-xs font-bold rounded-xl transition-all duration-300 text-slate-400 hover:text-white";
                title.innerText = "Create Account";
                sub.innerText = "Join FocusTrack to manage tasks and boost productivity";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            const users = JSON.parse(localStorage.getItem('focustrack_users') || '[]');

            if (users.some(u => u.username === username || u.email === email)) {
                alert('Username or Email already registered!');
                return;
            }

            const userData = {
                name: document.getElementById('regName').value,
                sex: document.getElementById('regSex').value,
                phone: document.getElementById('regPhone').value,
                email: email,
                username: username,
                password: password
            };

            users.push(userData);
            localStorage.setItem('focustrack_users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(userData));
            
            window.location.href = 'dashboard.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputUser = document.getElementById('loginUser').value.trim();
            const inputPass = document.getElementById('loginPass').value;

            const users = JSON.parse(localStorage.getItem('focustrack_users') || '[]');
            const foundUser = users.find(u => 
                (u.username === inputUser || u.email === inputUser) && u.password === inputPass
            );

            if (foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid Username/Email or Password!');
            }
        }
    </script>
</body>
</html>
